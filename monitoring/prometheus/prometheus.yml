global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/recording-rules.yml
  - /etc/prometheus/alert-rules.yml
scrape_configs:
  - job_name: local-ai-server
    metrics_path: /metrics
    bearer_token_file: /etc/local-ai-monitoring/llama-api-key
    static_configs:
      - targets: ["192.168.3.42:8080"]
  - job_name: node-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9100"]
