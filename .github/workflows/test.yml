name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Exercise CLI
        run: ./bin/local-ai-bench --suite quick-v1 doctor --backend cpu --json
      - name: Validate capacity suite
        run: ./bin/local-ai-bench --suite capacity-v1 doctor --backend cpu --json

  linux-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Smoke test checkout
        run: ./bin/linux-smoke
      - name: Compile pinned llama.cpp CPU runtime
        run: ./bin/local-ai-bench prepare --backend cpu --skip-models --jobs 2
      - name: Verify compiled runtime
        run: ./bin/local-ai-bench doctor --backend cpu

  linux-vulkan-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Configure official LunarG repository for Ubuntu 22.04
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list http://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
      - name: Install Vulkan build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake vulkan-sdk
      - name: Compile pinned llama.cpp Vulkan runtime
        run: ./bin/local-ai-bench prepare --backend vulkan --skip-models --jobs 2
      - name: Verify compiled Vulkan binary
        run: test -x .local-ai-bench/runtimes/llama.cpp/build-vulkan/bin/llama-bench
